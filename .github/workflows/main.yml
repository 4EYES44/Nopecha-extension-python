name: test-and-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify patcher.py is in the wheel
        run: |
          python -c "import glob, sys, zipfile; wheels = glob.glob('dist/*.whl'); assert wheels, 'no wheel was built'; names = zipfile.ZipFile(wheels[0]).namelist(); needle = 'nopecha_extension/patcher.py'; assert any(name == needle or name.endswith('/' + needle) for name in names), names"
